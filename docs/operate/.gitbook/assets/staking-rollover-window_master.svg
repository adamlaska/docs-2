<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, Helvetica, Arial, sans-serif" viewBox="0 0 1536 1092"><rect width="1536" height="1092" fill="#0A0A0A"/><rect width="1496" height="84" x="20" y="20" fill="#F65B27" rx="26"/><path fill="#111" stroke="#111" stroke-linejoin="round" stroke-width="1.5" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/><g fill="#FFF"><path fill-rule="evenodd" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z" transform="translate(-3.68,-115.07) scale(0.714)"/></g><text x="132" y="75" fill="#FFF" font-size="36" font-weight="500">The Rollover Window</text><rect width="1496" height="672" x="20" y="128" fill="#161618" rx="24"/><text x="64" y="180" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="2">THE LAST STRETCH OF A BOND: TWO GATES, ONE WINDOW</text><line x1="940" x2="940" y1="238" y2="648" stroke="#F9A03F" stroke-dasharray="6 6" stroke-width="2.5"/><text x="940" y="228" fill="#F9A03F" font-size="20" font-weight="600" text-anchor="middle">Day 175</text><line x1="1220" x2="1220" y1="238" y2="648" stroke="#F65B27" stroke-width="2.5"/><text x="1220" y="228" fill="#F65B27" font-size="20" font-weight="600" text-anchor="middle">Day 182: bond ends</text><text x="180" y="272" fill="#FFF" font-size="22" font-weight="600">Gate 1, non-overlap: the new position&apos;s first reward cycle is at or after this bond&apos;s last</text><rect width="1240" height="52" x="180" y="286" fill="#F9A03F" rx="12"/><text x="800" y="320" fill="#111" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="1" text-anchor="middle">PASSES: BOND N+6, OR STX-ONLY FROM THE NEXT CYCLE, DOES NOT OVERLAP</text><text x="180" y="392" fill="#FFF" font-size="22" font-weight="600">Gate 2, rollover window: Bitcoin height has reached this bond&apos;s L1 unlock height</text><rect width="760" height="52" x="180" y="406" fill="#3A3A3C" rx="12"/><text x="560" y="440" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="1" text-anchor="middle">FAILS BEFORE DAY 175</text><rect width="480" height="52" x="940" y="406" fill="#F9A03F" rx="12"/><text x="1180" y="440" fill="#111" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="1" text-anchor="middle">PASSES FROM DAY 175</text><text x="180" y="512" fill="#FFF" font-size="22" font-weight="600">Both gates together</text><rect width="760" height="52" x="180" y="526" fill="#3A3A3C" rx="12"/><text x="560" y="560" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="1" text-anchor="middle">CLOSED</text><rect width="480" height="52" x="940" y="526" fill="#F65B27" rx="12"/><text x="1080" y="560" fill="#FFF" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="1" text-anchor="middle">OPEN</text><text x="1322" y="560" fill="#FFF" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="1" text-anchor="middle">DOES NOT CLOSE</text><rect width="27" height="52" x="1193" y="526" fill="#161618" stroke="#8E8E93" stroke-dasharray="3 4" stroke-width="1.5"/><rect width="265" height="68" x="934" y="518" fill="none" stroke="#FFF" stroke-dasharray="7 6" stroke-width="3" rx="12"/><rect width="760" height="44" x="180" y="600" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="1.5" rx="10"/><text x="560" y="628" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="1" text-anchor="middle">24,150 BITCOIN BLOCKS FROM BOND START</text><rect width="253" height="44" x="940" y="600" fill="#2C2C2E" stroke="#6E6E73" stroke-width="1.5" rx="10"/><text x="1066" y="628" fill="#FFF" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="1" text-anchor="middle">950 BITCOIN BLOCKS</text><rect width="27" height="44" x="1193" y="600" fill="#161618" stroke="#8E8E93" stroke-dasharray="3 4" stroke-width="1.5"/><line x1="1206" x2="1206" y1="580" y2="598" stroke="#8E8E93" stroke-dasharray="3 4" stroke-width="1.5"/><rect width="200" height="44" x="1220" y="600" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="1.5" rx="10"/><text x="1320" y="628" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="1" text-anchor="middle">NEXT BOND</text><text x="180" y="686" fill="#C7C7CC" font-size="22">Both gates first pass together in the bond&apos;s final half reward cycle: after 24,150 of its 25,200 Bitcoin blocks.</text><text x="180" y="718" fill="#C7C7CC" font-size="20">The last 100 Bitcoin blocks of every cycle are the prepare phase: stake and register-for-bond are both rejected.</text><text x="180" y="748" fill="#FFF" font-size="20">So a roll into bond n+6 has 950 usable Bitcoin blocks, from Day 175 to the prepare phase before Day 182.</text><text x="180" y="778" fill="#C7C7CC" font-size="20">Bitcoin block heights are the trigger; day counts assume 6 months per bond and shift when blocks run fast or slow.</text><rect width="740" height="234" x="20" y="820" fill="#161618" rx="24"/><rect width="736" height="234" x="780" y="820" fill="#161618" rx="24"/><text x="64" y="874" fill="#FFF" font-size="25" font-weight="600">Bond to bond</text><text x="64" y="906" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="19">via register-for-bond</text><text fill="#C7C7CC" font-size="22"><tspan x="64" y="950">Only the net sBTC difference moves.</tspan> <tspan x="64" y="982">A same-size roll moves nothing, and the old</tspan> <tspan x="64" y="1014">bond&apos;s per-cycle shares stay in place.</tspan></text><text x="824" y="874" fill="#FFF" font-size="25" font-weight="600">Bond to STX-only staking</text><text x="824" y="906" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="19">via stake</text><text fill="#C7C7CC" font-size="22"><tspan x="824" y="950">All custodied sBTC is refunded.</tspan> <tspan x="824" y="982">An L1 bond has nothing to refund: the BTC is on</tspan> <tspan x="824" y="1014">Bitcoin under your own timelock.</tspan></text></svg>