r="middle">₿</text><text x="280" y="348" fill="#FFF" font-size="26" text-anchor="middle">Miner address</text><line x1="340" x2="1128" y1="272" y2="272" stroke="#F65B27" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3"/><path fill="none" stroke="#F65B27" stroke-linecap="round" stroke-width="3" d="M1118 262 L1128 272 L1118 282"/><text x="740" y="252" fill="#F65B27" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="2" text-anchor="middle">ONE POX OUTPUT</text><circle cx="1200" cy="272" r="38" fill="#F65B27"/><text x="1200" y="288" fill="#FFF" font-family="JetBrains Mono, Menlo, monospace" font-size="44" text-anchor="middle">₿</text><text x="1200" y="348" fill="#FFF" font-size="26" text-anchor="middle">sBTC bridge address</text><text x="740" y="388" fill="#C7C7CC" font-size="22" text-anchor="middle">Every block of the cycle pays this same output, prepare phase included. Nothing is sent to a burn address.</text><path fill="none" stroke="#F9A03F" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3" d="M1200 312 V446 H400 V582"/><path fill="none" stroke="#F9A03F" stroke-linecap="round" stroke-width="3" d="M390 572 L400 582 L410 572"/><text x="800" y="436" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="2" text-anchor="middle">BRIDGE MINTS SBTC INTO POX-5</text><rect width="1496" height="360" x="20" y="470" fill="#161618" rx="24"/><text x="64" y="522" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="2">AUTOMATED - ON STACKS</text><circle cx="400" cy="646" r="38" fill="#FFF"/><text x="400" y="654" fill="#111" font-family="JetBrains Mono, Menlo, monospace" font-size="20" text-anchor="middle">sBTC</text><text x="400" y="722" fill="#FFF" font-size="26" text-anchor="middle">pox-5 contract</text><line x1="446" x2="806" y1="646" y2="646" stroke="#8E8E93" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3"/><path fill="none" stroke="#8E8E93" stroke-linecap="round" stroke-width="3" d="M796 636 L806 646 L796 656"/><text x="626" y="624" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="2" text-anchor="middle">WATERFALL CREDIT</text><circle cx="880" cy="646" r="38" fill="#F65B27"/><text x="880" y="722" fill="#FFF" font-size="26" text-anchor="middle">Signer-Manager</text><line x1="926" x2="1246" y1="646" y2="646" stroke="#F9A03F" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3"/><path fill="none" stroke="#F9A03F" stroke-linecap="round" stroke-width="3" d="M1236 636 L1246 646 L1236 656"/><text x="1086" y="624" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="2" text-anchor="middle">SBTC, OR NATIVE BTC</text><circle cx="1320" cy="646" r="38" fill="#F9A03F"/><text x="1320" y="722" fill="#FFF" font-size="26" text-anchor="middle">Staker</text><text x="768" y="788" fill="#C7C7CC" font-size="22" text-anchor="middle">pox-5 credits the waterfall once per 1,050-block distribution: bonds first, then the reserve, then STX-only stakers. Managers claim any time.</text><rect width="1496" height="64" x="20" y="854" fill="#3A3A3C" opacity=".6" rx="20"/><text x="768" y="894" fill="#F2F2F4" font-size="24" text-anchor="middle">Two separate steps: the block commit pays a Bitcoin address; bridging and distribution happen on Stacks automatically.</text></svg>