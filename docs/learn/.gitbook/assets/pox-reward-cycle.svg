212 L1398 232"/></g><rect width="1194" height="96" x="138" y="256" fill="#F65B27" rx="18"/><text x="580" y="302" fill="#FFF" font-size="27" font-weight="600" text-anchor="middle">Reward phase</text><text x="580" y="334" fill="#FFD9C7" font-size="20" text-anchor="middle">2,000 Bitcoin blocks</text><rect width="60" height="96" x="1338" y="256" fill="#6E6E73" rx="12"/><line x1="1368" x2="1368" y1="256" y2="232" stroke="#6E6E73" stroke-width="2"/><text x="1404" y="180" fill="#FFF" font-size="20" font-weight="600" text-anchor="end">Prepare phase</text><line x1="1368" x2="1368" y1="250" y2="200" stroke="#6E6E73" stroke-dasharray="3 4" stroke-width="2"/><text x="1404" y="204" fill="#C7C7CC" font-size="18" text-anchor="end">100 Bitcoin blocks</text><rect width="90" height="96" x="1406" y="256" fill="#2C2C2E" rx="18"/><text x="1451" y="310" fill="#8E8E93" font-size="18" text-anchor="middle">next cycle</text><rect width="18" height="68" x="1338" y="270" fill="#FFF" rx="4" transform="rotate(0)"/><line x1="1347" x2="1347" y1="352" y2="420" stroke="#FFF" stroke-width="2.5"/><text x="1347" y="448" fill="#FFF" font-size="20" font-weight="600" text-anchor="end">Anchor block</text><text fill="#C7C7CC" font-size="18" text-anchor="end"><tspan x="1440" y="478">the first Stacks block confirmed in the prepare phase.</tspan> <tspan x="1440" y="504">The next cycle&apos;s signer set is determined</tspan> <tspan x="1440" y="530">from the chain state at that block.</tspan></text><line x1="768" x2="768" y1="256" y2="380" stroke="#F9A03F" stroke-dasharray="6 6" stroke-width="2.5"/><circle cx="768" cy="396" r="17" fill="#F9A03F"/><text x="768" y="403" fill="#111" font-size="18" font-weight="600" text-anchor="middle">1</text><line x1="1398" x2="1398" y1="356" y2="380" stroke="#F9A03F" stroke-dasharray="6 6" stroke-width="2.5"/><circle cx="1398" cy="396" r="17" fill="#F9A03F"/><text x="1398" y="403" fill="#111" font-size="18" font-weight="600" text-anchor="middle">2</text><text x="768" y="448" fill="#F9A03F" font-size="20" font-weight="600" text-anchor="middle">Distributions</text><text fill="#C7C7CC" font-size="18" text-anchor="middle"><tspan x="768" y="478">calculated every 1,050 Bitcoin blocks:</tspan> <tspan x="768" y="504">two per reward cycle</tspan></text><g fill="#6E6E73" font-family="JetBrains Mono, Menlo, monospace" font-size="17" text-anchor="middle"><text x="138" y="570">0</text><text x="768" y="570">1,050</text><text x="1338" y="570">2,000</text><text x="1398" y="596">2,099</text></g><line x1="138" x2="1398" y1="548" y2="548" stroke="#2C2C2E" stroke-width="2"/><g stroke="#2C2C2E" stroke-width="2"><line x1="138" x2="138" y1="542" y2="554"/><line x1="768" x2="768" y1="542" y2="554"/><line x1="1338" x2="1338" y1="542" y2="554"/><line x1="1398" x2="1398" y1="542" y2="554"/></g><text x="64" y="648" fill="#C7C7CC" font-size="20">The cycle repeats without pause: the block after the prepare phase is block 0 of the next cycle.</text></svg>