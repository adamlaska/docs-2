<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, Helvetica, Arial, sans-serif" viewBox="0 0 1536 1396"><rect width="1536" height="1396" fill="#0A0A0A"/><rect width="1496" height="84" x="20" y="20" fill="#F65B27" rx="26"/><path fill="#111" stroke="#111" stroke-linejoin="round" stroke-width="1.5" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/><g fill="#FFF"><path fill-rule="evenodd" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z" transform="translate(-3.68,-115.07) scale(0.714)"/></g><text x="132" y="75" fill="#FFF" font-size="36" font-weight="500">Staking Flow: Two Ways In</text><rect width="730" height="1120" x="24" y="132" fill="#161618" rx="24"/><rect width="730" height="1120" x="782" y="132" fill="#161618" rx="24"/><rect width="730" height="104" x="24" y="132" fill="#F65B27" rx="24"/><rect width="730" height="24" x="24" y="212" fill="#161618"/><text x="389" y="178" fill="#FFF" font-size="27" font-weight="600" text-anchor="middle">Bitcoin Staking: Protocol Bond</text><text x="389" y="208" fill="#FFD9C7" font-family="JetBrains Mono, Menlo, monospace" font-size="18" text-anchor="middle">allowlisted capacity - target APY</text><rect width="730" height="104" x="782" y="132" fill="#3A3A3C" rx="24"/><rect width="730" height="24" x="782" y="212" fill="#161618"/><text x="1147" y="178" fill="#FFF" font-size="27" font-weight="600" text-anchor="middle">STX-Only Staking</text><text x="1147" y="208" fill="#C7C7CC" font-family="JetBrains Mono, Menlo, monospace" font-size="18" text-anchor="middle">uncapped - residual yield</text><g><circle cx="80" cy="296" r="22" fill="#F65B27"/><text x="80" y="304" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">1</text><text x="120" y="290" fill="#FFF" font-size="22" font-weight="600">Get allowlisted</text><text x="120" y="322" fill="#C7C7CC" font-size="22">The Endowment sets your maximum sats for</text><text x="120" y="352" fill="#C7C7CC" font-size="22">the bond period. There is no auction in PoX-5.</text><circle cx="80" cy="428" r="22" fill="#F65B27"/><text x="80" y="436" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">2</text><text x="120" y="422" fill="#FFF" font-size="22" font-weight="600">Lock the Bitcoin leg</text><text x="120" y="454" fill="#C7C7CC" font-size="22">register-for-bond with the paired STX, before the bond starts.</text><rect width="322" height="196" x="64" y="478" fill="#3A3A3C" opacity=".6" rx="14"/><text x="96" y="516" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="2">NATIVE BTC</text><text x="96" y="548" fill="#C7C7CC" font-size="20">CLTV timelock on L1 under</text><text x="96" y="576" fill="#C7C7CC" font-size="20">your own keys, expiring no</text><text x="96" y="604" fill="#C7C7CC" font-size="20">earlier than 1,050 Bitcoin</text><text x="96" y="632" fill="#C7C7CC" font-size="20">blocks before bond end.</text><rect width="322" height="196" x="402" y="478" fill="#3A3A3C" opacity=".6" rx="14"/><text x="434" y="516" fill="#F65B27" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="2">SBTC</text><text x="434" y="548" fill="#C7C7CC" font-size="20">Locked in pox-5 custody</text><text x="434" y="576" fill="#C7C7CC" font-size="20">for the term. No Bitcoin</text><text x="434" y="604" fill="#C7C7CC" font-size="20">transaction needed.</text><circle cx="80" cy="742" r="22" fill="#F65B27"/><text x="80" y="750" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">3</text><text x="120" y="736" fill="#FFF" font-size="22" font-weight="600">Bond runs 12 reward cycles</text><text x="120" y="768" fill="#C7C7CC" font-size="22">Target APY on the sats, paid first in the waterfall:</text><text x="120" y="798" fill="#C7C7CC" font-size="22">24 distributions, one per 1,050 Bitcoin blocks.</text><text x="120" y="828" fill="#C7C7CC" font-size="22">The paired STX earns no yield.</text><circle cx="80" cy="900" r="22" fill="#F65B27"/><text x="80" y="908" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">4</text><text x="120" y="894" fill="#FFF" font-size="22" font-weight="600">Get paid</text><text x="120" y="926" fill="#C7C7CC" font-size="22">Your manager claims and distributes, as BTC on L1 or sBTC.</text><circle cx="80" cy="988" r="22" fill="#F65B27"/><text x="80" y="996" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">5</text><text x="120" y="982" fill="#FFF" font-size="22" font-weight="600">End or exit</text><text x="120" y="1014" fill="#C7C7CC" font-size="22">STX unlocks at bond end. Roll into bond n+6 from Day 175.</text><rect width="322" height="180" x="64" y="1038" fill="#3A3A3C" opacity=".6" rx="14"/><text x="96" y="1076" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="2">NATIVE BTC</text><text x="96" y="1108" fill="#C7C7CC" font-size="20">Timelock expires: re-lock</text><text x="96" y="1136" fill="#C7C7CC" font-size="20">or spend. Early exit forfeits</text><text x="96" y="1164" fill="#C7C7CC" font-size="20">the remaining yield.</text><rect width="322" height="180" x="402" y="1038" fill="#3A3A3C" opacity=".6" rx="14"/><text x="434" y="1076" fill="#F65B27" font-family="JetBrains Mono, Menlo, monospace" font-size="17" letter-spacing="2">SBTC</text><text x="434" y="1108" fill="#C7C7CC" font-size="20">Returned at term, or</text><text x="434" y="1136" fill="#C7C7CC" font-size="20">unstake-sbtc any time,</text><text x="434" y="1164" fill="#C7C7CC" font-size="20">forfeiting future yield.</text></g><g><circle cx="838" cy="296" r="22" fill="#3A3A3C"/><text x="838" y="304" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">1</text><text x="878" y="290" fill="#FFF" font-size="22" font-weight="600">Choose a signer-manager</text><text x="878" y="322" fill="#C7C7CC" font-size="22">Fee and admin set are readable on-chain</text><text x="878" y="352" fill="#C7C7CC" font-size="22">before you commit.</text><circle cx="838" cy="452" r="22" fill="#3A3A3C"/><text x="838" y="460" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">2</text><text x="878" y="446" fill="#FFF" font-size="22" font-weight="600">stake</text><text x="878" y="478" fill="#C7C7CC" font-size="22">Amount plus 1 to 96 reward cycles. STX locks in</text><text x="878" y="508" fill="#C7C7CC" font-size="22">your own account. No minimum for you: the</text><text x="878" y="538" fill="#C7C7CC" font-size="22">50,000 STX threshold is the manager&apos;s.</text><circle cx="838" cy="644" r="22" fill="#3A3A3C"/><text x="838" y="652" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">3</text><text x="878" y="638" fill="#FFF" font-size="22" font-weight="600">Earn per cycle</text><text x="878" y="670" fill="#C7C7CC" font-size="22">Miner BTC left after bond obligations: 85% to</text><text x="878" y="700" fill="#C7C7CC" font-size="22">STX-only stakers, 15% to the reserve. Credited</text><text x="878" y="730" fill="#C7C7CC" font-size="22">every 1,050 Bitcoin blocks.</text><circle cx="838" cy="838" r="22" fill="#3A3A3C"/><text x="838" y="846" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">4</text><text x="878" y="832" fill="#FFF" font-size="22" font-weight="600">Get paid</text><text x="878" y="864" fill="#C7C7CC" font-size="22">Your manager claims any time and distributes</text><text x="878" y="894" fill="#C7C7CC" font-size="22">sBTC, or native BTC if you elected that.</text><circle cx="838" cy="1000" r="22" fill="#3A3A3C"/><text x="838" y="1008" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">5</text><text x="878" y="994" fill="#FFF" font-size="22" font-weight="600">unstake any time</text><text x="878" y="1026" fill="#C7C7CC" font-size="22">Outside the prepare phase. STX unlocks at the</text><text x="878" y="1056" fill="#C7C7CC" font-size="22">next cycle start. Or roll into a bond as one opens.</text></g><rect width="1488" height="92" x="24" y="1276" fill="#161618" rx="24"/><circle cx="86" cy="1322" r="24" fill="#F65B27"/><g fill="none" stroke="#FFF" stroke-linecap="round" stroke-width="4"><path d="M76 1322 L84 1330 L98 1312"/></g><text x="132" y="1314" fill="#FFF" font-size="22" font-weight="600">Two mutually exclusive paths: one position per Stacks principal at a time, and both route through a signer-manager.</text><text x="132" y="1346" fill="#8E8E93" font-size="20">The STX always locks in your own account. Rewards credit every 1,050 Bitcoin blocks; managers claim on their own schedule.</text></svg>