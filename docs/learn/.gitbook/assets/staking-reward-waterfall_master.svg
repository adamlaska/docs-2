<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, Helvetica, Arial, sans-serif" viewBox="0 0 1536 1180"><rect width="1536" height="1180" fill="#0A0A0A"/><rect width="1496" height="84" x="20" y="20" fill="#F65B27" rx="26"/><path fill="#111" stroke="#111" stroke-linejoin="round" stroke-width="1.5" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/><g fill="#FFF"><path fill-rule="evenodd" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z" transform="translate(-3.68,-115.07) scale(0.714)"/></g><text x="132" y="75" fill="#FFF" font-size="36" font-weight="500">The Reward Waterfall</text><rect width="1496" height="72" x="20" y="128" fill="#F65B27" rx="18"/><text x="768" y="172" fill="#FFF" font-size="26" font-weight="500" text-anchor="middle">sBTC rewards arrive in pox-5, once per 1,050-Bitcoin-block distribution</text><line x1="768" x2="768" y1="204" y2="240" stroke="#F65B27" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3"/><path fill="none" stroke="#F65B27" stroke-linecap="round" stroke-width="3" d="M758 232 L768 242 L778 232"/><rect width="1496" height="474" x="20" y="250" fill="#161618" rx="24"/><text x="64" y="304" fill="#FFF" font-size="27" font-weight="600">Active Protocol Bonds Tranche</text><text x="64" y="336" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="2">PAID FIRST, IN FULL, BEFORE ANYTHING ELSE IS ALLOCATED</text><text x="64" y="378" fill="#C7C7CC" font-size="22">Bonds are paid in order: highest stx-value-ratio first (uSTX per 100 sats), lowest bond index breaks ties.</text><text x="64" y="412" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="20">each bond&apos;s target per distribution: (total-sats * target-rate / 10000) / 50</text><text x="64" y="450" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="19" letter-spacing="2">EXAMPLE: ONE DISTRIBUTION WHERE REWARDS RUN SHORT</text><rect width="250" height="128" x="64" y="470" fill="none" stroke="#6E6E73" stroke-width="2" rx="14"/><rect width="244" height="122" x="67" y="473" fill="#F65B27" rx="12"/><text x="189" y="516" fill="#FFF" font-size="22" font-weight="600" text-anchor="middle">paid 1st</text><text x="189" y="546" fill="#FFD9C7" font-size="19" text-anchor="middle">highest ratio</text><text x="189" y="630" fill="#C7C7CC" font-size="20" text-anchor="middle">full target</text><rect width="250" height="128" x="350" y="470" fill="none" stroke="#6E6E73" stroke-width="2" rx="14"/><rect width="244" height="122" x="353" y="473" fill="#F65B27" rx="12"/><text x="475" y="516" fill="#FFF" font-size="22" font-weight="600" text-anchor="middle">paid 2nd</text><text x="475" y="630" fill="#C7C7CC" font-size="20" text-anchor="middle">full target</text><rect width="250" height="128" x="636" y="470" fill="none" stroke="#6E6E73" stroke-width="2" rx="14"/><rect width="244" height="122" x="639" y="473" fill="#F65B27" rx="12"/><text x="761" y="516" fill="#FFF" font-size="22" font-weight="600" text-anchor="middle">paid 3rd</text><text x="761" y="630" fill="#C7C7CC" font-size="20" text-anchor="middle">full target</text><rect width="250" height="128" x="922" y="470" fill="none" stroke="#6E6E73" stroke-width="2" rx="14"/><rect width="244" height="53" x="925" y="542" fill="#F65B27" rx="10"/><text x="1047" y="516" fill="#FFF" font-size="22" font-weight="600" text-anchor="middle">paid 4th</text><text x="1047" y="630" fill="#F9A03F" font-size="20" text-anchor="middle">takes what remains</text><rect width="250" height="128" x="1208" y="470" fill="none" stroke="#3A3A3C" stroke-width="2" rx="14"/><text x="1333" y="516" fill="#6E6E73" font-size="22" font-weight="600" text-anchor="middle">5th</text><text x="1333" y="630" fill="#8E8E93" font-size="20" text-anchor="middle">nothing</text><text x="768" y="690" fill="#FFF" font-size="24" font-weight="600" text-anchor="middle">Shortfall is all or nothing per bond, not proportional.</text><line x1="768" x2="768" y1="728" y2="780" stroke="#FFF" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3"/><path fill="none" stroke="#FFF" stroke-linecap="round" stroke-width="3" d="M758 772 L768 782 L778 772"/><text x="800" y="762" fill="#FFF" font-size="24" font-weight="600">cycle excess: what remains after every bond is paid</text><path fill="none" stroke="#8E8E93" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3" d="M768 790 L460 828"/><path fill="none" stroke="#8E8E93" stroke-linecap="round" stroke-width="3" d="M474 820 L460 828 L472 838"/><path fill="none" stroke="#8E8E93" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3" d="M768 790 L1218 828"/><path fill="none" stroke="#8E8E93" stroke-linecap="round" stroke-width="3" d="M1204 838 L1218 828 L1204 820"/><rect width="880" height="250" x="20" y="840" fill="#161618" rx="24"/><text x="64" y="894" fill="#FFF" font-size="27" font-weight="600">STX-only stakers Tranche</text><text x="64" y="964" fill="#F65B27" font-size="52" font-weight="600">85%</text><text x="64" y="1006" fill="#C7C7CC" font-size="22">of the cycle excess, pro rata by shares staked.</text><rect width="596" height="250" x="920" y="840" fill="#161618" rx="24"/><text x="964" y="894" fill="#FFF" font-size="27" font-weight="600">Reserve Fund Tranche</text><text x="964" y="964" fill="#F9A03F" font-size="52" font-weight="600">15%</text><text x="964" y="1006" fill="#C7C7CC" font-size="22">of the cycle excess (RESERVE_RATIO u1500 of 10,000).</text><text x="964" y="1040" fill="#C7C7CC" font-size="22">The reserve only grows: no contract function</text><text x="964" y="1070" fill="#C7C7CC" font-size="22">draws it down.</text><path fill="none" stroke="#F9A03F" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="3" d="M460 1090 V1130 H1218 V1100"/><path fill="none" stroke="#F9A03F" stroke-linecap="round" stroke-width="3" d="M1208 1110 L1218 1100 L1228 1110"/><text x="839" y="1162" fill="#F9A03F" font-family="JetBrains Mono, Menlo, monospace" font-size="20" letter-spacing="1" text-anchor="middle">IF NO STX-ONLY STAKERS THIS CYCLE, THE 85% FOLDS INTO THE RESERVE: IT TAKES 100% OF THE CYCLE EXCESS</text></svg>