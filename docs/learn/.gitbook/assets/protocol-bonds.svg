<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, Helvetica, Arial, sans-serif" viewBox="0 0 1536 1250"><rect width="1536" height="1250" fill="#0A0A0A"/><rect width="1496" height="84" x="20" y="20" fill="#F65B27" rx="26"/><path fill="#111" stroke="#111" stroke-linejoin="round" stroke-width="1.5" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/><g fill="#FFF"><path fill-rule="evenodd" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z" transform="translate(-3.68,-115.07) scale(0.714)"/></g><text x="132" y="75" fill="#FFF" font-size="36" font-weight="600">Protocol Bonds</text><text x="24" y="164" fill="#FFF" font-size="27" font-weight="600">Six bonds run at once, staggered</text><text x="24" y="196" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="21">new bond period every 2 reward cycles (4,200 blocks, ~1 month) - each runs 12 cycles (25,200 blocks, ~6 months)</text><g fill="#6E6E73" font-family="JetBrains Mono, Menlo, monospace" font-size="17" text-anchor="middle"><text x="150" y="232">0</text><text x="262" y="232">2</text><text x="374" y="232">4</text><text x="486" y="232">6</text><text x="598" y="232">8</text><text x="710" y="232">10</text><text x="822" y="232">12</text><text x="934" y="232">14</text><text x="1046" y="232">16</text><text x="1158" y="232">18</text><text x="1270" y="232">20</text><text x="1382" y="232">22</text><text x="1494" y="232">24</text></g><text x="88" y="232" fill="#6E6E73" font-family="JetBrains Mono, Menlo, monospace" font-size="17" text-anchor="start">cycle</text><line x1="150" x2="1494" y1="244" y2="244" stroke="#2C2C2E" stroke-width="2"/><g stroke="#1C1C1E" stroke-width="1.5"><line x1="150" x2="150" y1="244" y2="700"/><line x1="262" x2="262" y1="244" y2="700"/><line x1="374" x2="374" y1="244" y2="700"/><line x1="486" x2="486" y1="244" y2="700"/><line x1="598" x2="598" y1="244" y2="700"/><line x1="710" x2="710" y1="244" y2="700"/><line x1="822" x2="822" y1="244" y2="700"/><line x1="934" x2="934" y1="244" y2="700"/><line x1="1046" x2="1046" y1="244" y2="700"/><line x1="1158" x2="1158" y1="244" y2="700"/><line x1="1270" x2="1270" y1="244" y2="700"/><line x1="1382" x2="1382" y1="244" y2="700"/><line x1="1494" x2="1494" y1="244" y2="700"/></g><g fill="#FFF" font-size="19" font-weight="600"><rect width="672" height="44" x="150" y="260" fill="#F65B27" rx="10"/><text x="166" y="289">bond i</text><rect width="672" height="44" x="262" y="318" fill="#3A3A3C" rx="10"/><text x="278" y="347" fill="#C7C7CC">bond i+1</text><rect width="672" height="44" x="374" y="376" fill="#3A3A3C" rx="10"/><text x="390" y="405" fill="#C7C7CC">bond i+2</text><rect width="672" height="44" x="486" y="434" fill="#3A3A3C" rx="10"/><text x="502" y="463" fill="#C7C7CC">bond i+3</text><rect width="672" height="44" x="598" y="492" fill="#3A3A3C" rx="10"/><text x="614" y="521" fill="#C7C7CC">bond i+4</text><rect width="672" height="44" x="710" y="550" fill="#3A3A3C" rx="10"/><text x="726" y="579" fill="#C7C7CC">bond i+5</text><rect width="672" height="44" x="822" y="608" fill="#E8E8ED" rx="10"/><text x="838" y="637" fill="#111">bond i+6</text></g><line x1="822" x2="822" y1="252" y2="668" stroke="#F65B27" stroke-dasharray="6 6" stroke-width="2.5"/><path fill="none" stroke="#F65B27" stroke-width="3" d="M826 282 C 880 282, 880 616, 832 626"/><path fill="#F65B27" d="M842 630 L828 632 L836 618 Z"/><text x="850" y="676" fill="#F65B27" font-size="20" font-weight="600">bond i ends at the block where bond i+6 starts: direct roll-over</text><line x1="766" x2="766" y1="252" y2="600" stroke="#8E8E93" stroke-dasharray="3 6" stroke-width="2"/><text x="758" y="700" fill="#8E8E93" font-size="19" text-anchor="end">any moment: 6 bonds active</text><text x="24" y="768" fill="#FFF" font-size="27" font-weight="600">One bond period, start to finish</text><rect width="280" height="72" x="150" y="826" fill="#3A3A3C" rx="14"/><text x="290" y="857" fill="#FFF" font-size="21" font-weight="600" text-anchor="middle">Enrollment</text><text x="290" y="884" fill="#C7C7CC" font-size="18" text-anchor="middle">opens ≤ 2 cycles before start</text><rect width="852" height="72" x="438" y="826" fill="#F65B27" rx="14"/><text x="864" y="857" fill="#FFF" font-size="21" font-weight="600" text-anchor="middle">Bond term: 12 cycles (~6 months)</text><text x="864" y="884" fill="#FFD9C7" font-size="18" text-anchor="middle">BTC + STX locked · rewards credited every 1,050 blocks</text><rect width="46" height="96" x="1250" y="814" fill="none" stroke="#FFF" stroke-dasharray="7 6" stroke-width="3" rx="10"/><line x1="1273" x2="1273" y1="812" y2="770" stroke="#FFF" stroke-width="2"/><text x="1273" y="756" fill="#FFF" font-size="19" font-weight="600" text-anchor="middle">re-lock window</text><rect width="196" height="72" x="1298" y="826" fill="#E8E8ED" rx="14"/><text x="1396" y="857" fill="#111" font-size="21" font-weight="600" text-anchor="middle">Bond ends</text><text x="1396" y="884" fill="#3A3A3C" font-size="18" text-anchor="middle">STX unlocks here</text><g stroke="#FFF" stroke-width="2" opacity=".55"><line x1="473" x2="473" y1="900" y2="912"/><line x1="508" x2="508" y1="900" y2="912"/><line x1="543" x2="543" y1="900" y2="912"/><line x1="578" x2="578" y1="900" y2="912"/><line x1="613" x2="613" y1="900" y2="912"/><line x1="648" x2="648" y1="900" y2="912"/><line x1="683" x2="683" y1="900" y2="912"/><line x1="718" x2="718" y1="900" y2="912"/><line x1="753" x2="753" y1="900" y2="912"/><line x1="788" x2="788" y1="900" y2="912"/><line x1="823" x2="823" y1="900" y2="912"/><line x1="858" x2="858" y1="900" y2="912"/><line x1="893" x2="893" y1="900" y2="912"/><line x1="928" x2="928" y1="900" y2="912"/><line x1="963" x2="963" y1="900" y2="912"/><line x1="998" x2="998" y1="900" y2="912"/><line x1="1033" x2="1033" y1="900" y2="912"/><line x1="1068" x2="1068" y1="900" y2="912"/><line x1="1103" x2="1103" y1="900" y2="912"/><line x1="1138" x2="1138" y1="900" y2="912"/><line x1="1173" x2="1173" y1="900" y2="912"/><line x1="1208" x2="1208" y1="900" y2="912"/><line x1="1243" x2="1243" y1="900" y2="912"/><line x1="1278" x2="1278" y1="900" y2="912"/></g><text x="864" y="938" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="18" text-anchor="middle">24 distributions, one per 1,050 blocks (~weekly) - claimable by your signer-manager any time after</text><line x1="438" x2="438" y1="812" y2="904" stroke="#FFF" stroke-width="2.5"/><text x="438" y="795" fill="#FFF" font-size="19" font-weight="600" text-anchor="middle">start</text><rect width="486" height="250" x="24" y="972" fill="#161618" rx="24"/><rect width="486" height="250" x="530" y="972" fill="#161618" rx="24"/><rect width="480" height="250" x="1036" y="972" fill="#161618" rx="24"/><circle cx="88" cy="1032" r="26" fill="#3A3A3C"/><text x="88" y="1042" fill="#FFF" font-size="28" font-weight="600" text-anchor="middle">1</text><text fill="#C7C7CC" font-size="23"><tspan x="62" y="1102">Before the start: win capacity in</tspan> <tspan x="62" y="1136">the bond&apos;s auction, then register</tspan> <tspan x="62" y="1170">with your BTC (L1 timelock or</tspan> <tspan x="62" y="1204">sBTC) and the paired STX.</tspan></text><circle cx="594" cy="1032" r="26" fill="#FFF"/><text x="594" y="1042" fill="#111" font-size="28" font-weight="600" text-anchor="middle">2</text><text fill="#C7C7CC" font-size="23"><tspan x="568" y="1102">Last 1,050 blocks (~1 week): the</tspan> <tspan x="568" y="1136">L1 BTC timelock expires early, so</tspan> <tspan x="568" y="1170">you can re-lock BTC for the next</tspan> <tspan x="568" y="1204">bond. STX stays locked to the end.</tspan></text><circle cx="1100" cy="1032" r="26" fill="#F65B27"/><text x="1100" y="1042" fill="#FFF" font-size="28" font-weight="600" text-anchor="middle">3</text><text fill="#C7C7CC" font-size="23"><tspan x="1074" y="1102">Roll over: register for bond i+6</tspan> <tspan x="1074" y="1136">during the window and the STX</tspan> <tspan x="1074" y="1170">lock simply extends. Otherwise</tspan> <tspan x="1074" y="1204">STX unlocks when the bond ends.</tspan></text></svg>