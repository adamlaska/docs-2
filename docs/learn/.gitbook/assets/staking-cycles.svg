<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, Helvetica, Arial, sans-serif" viewBox="0 0 1536 880"><rect width="1536" height="880" fill="#0A0A0A"/><rect width="1496" height="84" x="20" y="20" fill="#F65B27" rx="26"/><path fill="#111" stroke="#111" stroke-linejoin="round" stroke-width="1.5" d="M52.000,62.000 C52.000,45.431 65.431,32.000 82.000,32.000 C98.569,32.000 112.000,45.431 112.000,62.000 C112.000,78.569 98.569,92.000 82.000,92.000 C65.431,92.000 52.000,78.569 52.000,62.000 Z"/><g fill="#FFF"><path fill-rule="evenodd" d="M127.15,241.02c-.15-.26-.13-.59.04-.86l7.33-10.88c.2-.31.22-.68.04-.99-.18-.33-.51-.51-.86-.51h-2.85c-.31,0-.61.15-.81.44l-8.56,12.75c-.22.33-.57.51-.97.51h-1.08c-.4,0-.75-.2-.97-.51l-8.52-12.77c-.18-.29-.5-.44-.81-.44h-2.85c-.35,0-.7.2-.86.53-.18.33-.13.7.04.99l7.33,10.9c.18.24.2.57.04.84-.15.29-.42.44-.72.44h-11.22c-.55,0-.97.44-.97.97v2.37c0,.55.44.97.97.97h38.18c.55,0,.97-.44.97-.97v-2.37c0-.51-.37-.9-.86-.97h-11.33c-.31,0-.59-.15-.72-.44ZM118.5,255.02l-8.56,12.75c-.18.29-.5.44-.81.44h-2.85c-.35,0-.68-.2-.86-.51-.18-.31-.15-.7.04-.99l7.31-10.88c.18-.26.2-.57.04-.86-.15-.26-.42-.44-.72-.44h-11.18c-.53,0-.97-.42-.97-.97v-2.37c0-.53.42-.97.97-.97h38.18c.53,0,.97.42.97.97v2.37c0,.53-.42.97-.97.97h-11.2c-.33,0-.59.15-.72.44-.15.29-.13.59.04.84l7.33,10.9c.18.29.22.66.04.99-.18.33-.5.53-.86.53h-2.85c-.33,0-.61-.15-.79-.42l-8.56-12.75c-.22-.33-.57-.51-.97-.51h-1.08c-.4,0-.75.2-.97.51l-.02-.04Z" transform="translate(-3.68,-115.07) scale(0.714)"/></g><text x="132" y="75" fill="#FFF" font-size="36" font-weight="600">Cycles</text><text x="620" y="186" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace" font-size="21" letter-spacing="1" text-anchor="middle">one reward cycle: ~2 weeks / 2,100 Bitcoin blocks</text><g fill="none" stroke="#8E8E93" stroke-dasharray="4 5" stroke-width="2"><path d="M24 226 L24 206 L1216 206 L1216 226"/></g><rect width="1000" height="96" x="24" y="256" fill="#F65B27" rx="18"/><text x="524" y="314" fill="#FFF" font-size="30" font-weight="600" text-anchor="middle">Reward Phase (Proof of Transfer)</text><rect width="184" height="96" x="1032" y="256" fill="#6E6E73" rx="18"/><text x="1124" y="296" fill="#FFF" font-size="25" font-weight="600" text-anchor="middle">Prepare</text><text x="1124" y="328" fill="#FFF" font-size="25" font-weight="600" text-anchor="middle">Phase</text><rect width="26" height="96" x="1224" y="256" fill="#FFF" rx="13"/><text x="1270" y="296" fill="#FFF" font-size="26" font-weight="600" text-anchor="start">Unlock, then</text><text x="1270" y="330" fill="#FFF" font-size="26" font-weight="600" text-anchor="start">the next cycle</text><rect width="486" height="440" x="24" y="392" fill="#161618" rx="24"/><rect width="486" height="440" x="530" y="392" fill="#161618" rx="24"/><rect width="230" height="440" x="1036" y="392" fill="#161618" rx="24"/><rect width="230" height="440" x="1286" y="392" fill="#161618" rx="24"/><circle cx="88" cy="464" r="26" fill="#F65B27"/><text x="88" y="474" fill="#FFF" font-size="28" font-weight="600" text-anchor="middle">1</text><text fill="#C7C7CC" font-size="25"><tspan x="62" y="548">During the reward phase,</tspan> <tspan x="62" y="584">miners commit BTC to mine</tspan> <tspan x="62" y="620">Stacks blocks. That BTC funds</tspan> <tspan x="62" y="656">staker rewards, which pox-5</tspan> <tspan x="62" y="692">settles per staker to each</tspan> <tspan x="62" y="728">signer-manager.</tspan></text><circle cx="594" cy="464" r="26" fill="#F65B27"/><text x="594" y="474" fill="#FFF" font-size="28" font-weight="600" text-anchor="middle">2</text><text fill="#C7C7CC" font-size="25"><tspan x="568" y="548">Rewards are credited once per</tspan> <tspan x="568" y="584">distribution interval of 1,050</tspan> <tspan x="568" y="620">Bitcoin blocks (roughly one</tspan> <tspan x="568" y="656">week), two per cycle. Managers</tspan> <tspan x="568" y="692">claim credited rewards at</tspan> <tspan x="568" y="728">any time.</tspan></text><circle cx="1100" cy="464" r="26" fill="#6E6E73"/><text x="1100" y="474" fill="#FFF" font-size="28" font-weight="600" text-anchor="middle">3</text><text fill="#C7C7CC" font-size="25"><tspan x="1074" y="548">The prepare</tspan> <tspan x="1074" y="584">phase, the last</tspan> <tspan x="1074" y="620">100 blocks,</tspan> <tspan x="1074" y="656">fixes the next</tspan> <tspan x="1074" y="692">signer set.</tspan> <tspan x="1074" y="728">Staking is</tspan> <tspan x="1074" y="764">blocked.</tspan></text><circle cx="1350" cy="464" r="26" fill="#FFF"/><text x="1350" y="474" fill="#111" font-size="28" font-weight="600" text-anchor="middle">4</text><text fill="#C7C7CC" font-size="25"><tspan x="1324" y="548">Unlocks happen</tspan> <tspan x="1324" y="584">here: ended and</tspan> <tspan x="1324" y="620">unstaked</tspan> <tspan x="1324" y="656">positions</tspan> <tspan x="1324" y="692">become</tspan> <tspan x="1324" y="728">spendable.</tspan></text></svg>